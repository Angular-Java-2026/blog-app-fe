<div class="bg-surface-0 dark:bg-surface-900 px-6 lg:px-20 py-20">
  <div class="w-full flex items-start lg:flex-row flex-col gap-12">
    <div class="lg:w-1/3">
      <h1 class="text-4xl font-bold text-surface-900 dark:text-surface-0 leading-tight">Recent News</h1>
      <p class="mt-4 text-surface-600 dark:text-surface-200 text-lg leading-normal">Stay updated with the latest
        discoveries, innovations, and explorations in space science.</p>
    </div>
    <div class="flex-1 flex flex-col gap-8">
      @for (item of blogs(); track item.title; let index = $index) {
      <div class="flex items-start md:flex-row flex-col gap-6">
        <div class="md:flex-1">
          <div class="py-1 px-2 rounded-md bg-surface-100 dark:bg-surface-800 w-fit">
            <span class="text-surface-600 dark:text-surface-200 text-sm">{{ item.updatedAt | date: 'fullDate' }}</span>
          </div>
          <h4 class="mt-4 text-xl font-medium text-surface-900 dark:text-surface-0 leading-tight">{{ item.title }}</h4>
          <p class="mt-2 text-lg text-surface-600 dark:text-surface-200 leading-normal">{{ item.content }}</p>
        </div>
      </div>
      }
    </div>
  </div>
</div>
